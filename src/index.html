<!doctype html>
<html lang=ko>
<head>
    <meta charset=UTF-8>
    <meta content="width=device-width,initial-scale=1" name=viewport>
    <title>갈색 토끼</title>
    <script src="https://pixijs.download/v8.0.0/pixi.min.js"></script>
    <style>body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #1099bb
    }</style>

</head>
<body>
<script>
    (async () => {
        const app = new PIXI.Application({
            width: 800,
            height: 600,
        });

        await app.init({background: '#ffffff'});
        document.body.appendChild(app.canvas);

        const texture = await PIXI.Assets.load('https://pixijs.com/assets/bunny.png');

        const bunny = new PIXI.Sprite(texture);

        app.stage.addChild(bunny);

        bunny.y = 100;

        // bunny.x = app.renderer.width - bunny.width

        const rightEdge = app.renderer.width - bunny.width

        console.log("app.renderer.width :", app.renderer.width)
        console.log("bunny.width :", bunny.width)

        let speed = 2
        app.ticker.add(() => {
            bunny.x += speed;

            if (bunny.x > rightEdge) {
                speed = -2;
            }
            if (bunny.x < 0) {
                speed = 2
            }
        })


    })()

</script>
</body>
</html>
